[workspace]
members = ["app"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/pathscale/pdf-viewer"

[workspace.dependencies]
rusty_alloc = { package = "ps-rusty_alloc", version = "^2.3.3" }
pdf-toolkit = { version = "^0.3.9", features = ["text", "render", "raster", "write", "edit", "jpx", "jxl"] }
izumo = { version = "^0.5", default-features = false, features = ["runtime", "agent-control", "diagnostics"] }
blitz-dom = { package = "ps-blitz-dom", version = "^0.5" }
blitz-script = { package = "ps-blitz-script", version = "^0.5", features = ["intl", "shadow-dom"] }
blitz-traits = { package = "ps-blitz-traits", version = "^0.5" }
serde_json = "^1"
brotli = { version = "^8", default-features = false, features = ["std"] }
nagoya = "^0.1"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
strip = "none"

