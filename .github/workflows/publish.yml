name: Publish

# Dispatch manually from master after a reviewed manifest version bump. Cargo packages and
# uploads the crate (verified by the local gate, not here); crates.io decides whether that version can be published.
on:
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The crate carries the built interface in app/ui (ignored by git, listed in the crate include).
      - name: Build the interface
        working-directory: frontend
        run: bun install && bun run crate

      - name: Publish
        run: cargo publish -p pdf-viewer --registry crates-io --allow-dirty --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
