[package]
name = "pdf-viewer"
description = "A PDF viewer with page and reading views"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"
readme = "../README.md"
keywords = ["pdf", "viewer", "reader"]
categories = ["gui"]
include = ["src/**", "assets/**", "ui/**", "build.rs", "Cargo.toml"]

[[bin]]
name = "pdf-viewer"
path = "src/main.rs"

[features]
default = []
system-fonts = ["blitz-dom/system-fonts", "blitz-script/system-fonts"]

[dependencies]
libc = "^0.2.189"
pdf-toolkit.workspace = true
izumo.workspace = true
blitz-dom = { workspace = true, features = ["woff"] }
blitz-script.workspace = true
blitz-traits.workspace = true
serde_json.workspace = true
brotli.workspace = true
nagoya = { version = "^0.1.12", features = ["reactor"] }
rusty_alloc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "^0.6"
objc2-foundation = "^0.3"
objc2-app-kit = "^0.3"
block2 = "^0.6"

[build-dependencies]
brotli.workspace = true
miniz_oxide = "^0.8"

